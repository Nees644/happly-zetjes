<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gelukt — Zetjes</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600&family=Lora:ital,wght@0,600;1,400&display=swap');
  :root { --pink: #CC0066; --text: #1A0A12; --text-mid: #5E3A4E; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #FDF8FB; font-family: 'DM Sans', sans-serif; color: var(--text);
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .shell { width: 400px; background: #fff; border-radius: 36px;
    box-shadow: 0 40px 100px rgba(204,0,102,.10), 0 8px 32px rgba(26,10,18,.08);
    padding: 48px 28px; text-align: center; }
  .icon { font-size: 52px; margin-bottom: 16px; }
  h1 { font-family: 'Lora', serif; font-size: 24px; font-weight: 600; margin-bottom: 12px; }
  p { color: var(--text-mid); font-size: 14.5px; line-height: 1.6; }
  a { color: var(--pink); }
</style>
</head>
<body>
<div class="shell">
  <div class="icon">🎉</div>
  <h1>Gelukt</h1>
  <p>Je persoonlijke link staat in je mail. Geen mail binnen een paar minuten? Kijk in je spam of mail naar <a href="mailto:hallo@zetjes.nl">hallo@zetjes.nl</a>.</p>
</div>
</body>
</html>
